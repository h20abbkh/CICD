name: "1 - Content Planning"

# Trigger manually with all required inputs, or on a schedule.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        type: string
      audience:
        description: "Target audience"
        required: true
        default: "general public"
        type: string
      duration_minutes:
        description: "Target duration in minutes (30-60)"
        required: true
        default: "45"
        type: string
      tone:
        description: "Video tone (educational, entertaining, documentary, motivational)"
        required: true
        default: "educational"
        type: string
      style:
        description: "Visual style (minimalist, cinematic, cartoon, documentary)"
        required: true
        default: "minimalist"
        type: string
      voice_type:
        description: "OpenAI TTS voice"
        required: true
        default: "nova"
        type: choice
        options:
          - alloy
          - echo
          - fable
          - onyx
          - nova
          - shimmer
      upload_title:
        description: "YouTube title (leave blank to auto-generate from topic)"
        required: false
        type: string
      upload_description:
        description: "YouTube description (leave blank to auto-generate)"
        required: false
        type: string

jobs:
  generate-script:
    name: Generate Script
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
          TARGET_AUDIENCE: ${{ inputs.audience }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          VIDEO_TONE: ${{ inputs.tone }}
          VISUAL_STYLE: ${{ inputs.style }}
          VOICE_TYPE: ${{ inputs.voice_type }}
          UPLOAD_TITLE: ${{ inputs.upload_title }}
          UPLOAD_DESCRIPTION: ${{ inputs.upload_description }}
        run: python scripts/generate_script.py

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-script-${{ github.run_id }}
          path: output/script/
          retention-days: 30

      - name: Print review instructions
        run: |
          echo "============================================================"
          echo "Script generation complete!"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "NEXT STEP:"
          echo "1. Download artifact 'video-script-${{ github.run_id }}'"
          echo "2. Review output/script/script_readable.txt"
          echo "3. Trigger workflow '2 - Script Approval' with:"
          echo "   planning_run_id = ${{ github.run_id }}"
          echo "============================================================"
