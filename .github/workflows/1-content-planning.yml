name: "1 - Content Planning"

# Trigger manually with all required inputs, or on a schedule.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (franchise, character, or universe)"
        required: true
        type: string
      video_format:
        description: "Video format (defines structure and title formula)"
        required: true
        default: "timeline"
        type: choice
        options:
          - timeline
          - character_evolution
          - animated_summary
      duration_minutes:
        description: "Target duration in minutes (30-60)"
        required: true
        default: "45"
        type: choice
        options:
          - "30"
          - "45"
          - "60"
      voice_type:
        description: "OpenAI TTS voice (onyx = deep cinematic, default for this channel)"
        required: true
        default: "onyx"
        type: choice
        options:
          - alloy
          - echo
          - fable
          - onyx
          - nova
          - shimmer
      upload_title:
        description: "YouTube title override (leave blank to auto-generate using blueprint formula)"
        required: false
        type: string
      upload_description:
        description: "YouTube description override (leave blank to auto-generate)"
        required: false
        type: string

jobs:
  generate-script:
    name: Generate Script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_FORMAT: ${{ inputs.video_format }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          VOICE_TYPE: ${{ inputs.voice_type }}
          UPLOAD_TITLE: ${{ inputs.upload_title }}
          UPLOAD_DESCRIPTION: ${{ inputs.upload_description }}
        run: python scripts/generate_script.py

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-script-${{ github.run_id }}
          path: output/script/
          retention-days: 30

      - name: Print review instructions
        run: |
          echo "============================================================"
          echo "Script generation complete!"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "NEXT STEP:"
          echo "1. Download artifact 'video-script-${{ github.run_id }}'"
          echo "2. Review output/script/script_readable.txt"
          echo "3. Trigger workflow '2 - Script Approval' with:"
          echo "   planning_run_id = ${{ github.run_id }}"
          echo "============================================================"
